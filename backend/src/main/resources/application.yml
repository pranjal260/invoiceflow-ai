spring:
  application:
    name: ${SPRING_APPLICATION_NAME:invoiceflow-ai}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

storage:
  endpoint: ${B2_ENDPOINT}
  region: ${B2_REGION}
  bucket: ${B2_BUCKET}
  access-key-id: ${B2_ACCESS_KEY_ID}
  secret-access-key: ${B2_SECRET_ACCESS_KEY}
  presigned-url-expiration-minutes: ${STORAGE_PRESIGNED_URL_EXPIRATION:15}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
